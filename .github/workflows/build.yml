
name: NEXUS AI APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/nexus/ai
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NEXUS-AI"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.nexus.ai"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.nexus.ai"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:theme="@style/AppTheme"
                  android:label="NEXUS AI"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#7C83FF</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#080B18</item>
                  <item name="android:navigationBarColor">#080B18</item>
                  <item name="android:windowBackground">#080B18</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/nexus/ai/MainActivity.kt <<'EOF'
          package com.nexus.ai

          import android.app.Activity
          import android.os.Bundle
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.*
          import android.text.Editable
          import android.text.TextWatcher
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : Activity() {
              private lateinit var appsLayout: LinearLayout
              private lateinit var search: EditText
              private var apps = listOf<android.content.pm.ResolveInfo>()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.rgb(8,11,24)
                  window.navigationBarColor = Color.rgb(8,11,24)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 35, 24, 20)
                      setBackgroundColor(Color.rgb(8,11,24))
                  }

                  val title = TextView(this).apply {
                      text = "N E X U S"
                      textSize = 27f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  root.addView(title)

                  val subtitle = TextView(this).apply {
                      text = "ARTIFICIAL INTELLIGENCE"
                      textSize = 10f
                      setTextColor(Color.rgb(124,131,255))
                  }
                  root.addView(subtitle)

                  val clock = TextView(this).apply {
                      text = SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date())
                      textSize = 54f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0,35,0,0)
                  }
                  root.addView(clock)

                  val assistant = TextView(this).apply {
                      text = "NEXUS AI  •  SYSTEM ONLINE\n\nMerhaba. Sana nasıl yardımcı olabilirim?"
                      textSize = 15f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(16,22,16,22)
                      setBackgroundColor(Color.rgb(20,25,48))
                  }
                  val assistantParams = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  )
                  assistantParams.setMargins(0,25,0,20)
                  root.addView(assistant, assistantParams)

                  search = EditText(this).apply {
                      hint = "Uygulama ara..."
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.WHITE)
                      textSize = 15f
                      setSingleLine(true)
                      setPadding(16,12,16,12)
                      setBackgroundColor(Color.rgb(20,25,48))
                  }
                  root.addView(search)

                  val appsTitle = TextView(this).apply {
                      text = "UYGULAMALAR"
                      textSize = 12f
                      setTextColor(Color.rgb(124,131,255))
                      setPadding(0,20,0,10)
                  }
                  root.addView(appsTitle)

                  val scroll = ScrollView(this)
                  appsLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }
                  scroll.addView(appsLayout)
                  root.addView(scroll, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f
                  ))

                  setContentView(root)
                  loadApps()

                  search.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {
                          showApps(s.toString())
                      }
                      override fun afterTextChanged(s: Editable?) {}
                  })
              }

              private fun loadApps() {
                  val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  apps = packageManager.queryIntentActivities(intent, 0)
                      .sortedBy { it.loadLabel(packageManager).toString().lowercase() }
                  showApps("")
              }

              private fun showApps(query: String) {
                  appsLayout.removeAllViews()
                  apps.filter {
                      it.loadLabel(packageManager).toString().contains(query, true)
                  }.forEach { app ->
                      val row = TextView(this).apply {
                          text = "▸  ${app.loadLabel(packageManager)}"
                          textSize = 16f
                          setTextColor(Color.WHITE)
                          setPadding(15,16,15,16)
                          setOnClickListener {
                              val launch = packageManager.getLaunchIntentForPackage(
                                  app.activityInfo.packageName
                              )
                              if (launch != null) startActivity(launch)
                          }
                      }
                      appsLayout.addView(row)
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
